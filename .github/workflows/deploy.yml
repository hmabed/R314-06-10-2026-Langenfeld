name: Deploy Clients

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            export PATH="$HOME/.bun/bin:$PATH"

            cd /var/www/clients/R314-06-10-2026-Langenfeld
            echo "======================================"
            echo "Début du pulling"
            echo "======================================"
            git pull origin main

            echo "======================================"
            echo "Début du génération de code"
            echo "======================================"
            bun install
            bun run --bun build
            echo "======================================"
            echo "Début du redémarrage du service"
            echo "======================================"
            # restart non-interactively and dump journal on failure
            sudo -n systemctl restart clients
            sudo -n systemctl status clients --no-pager
            echo "======================================"
            echo "test du service"
            echo "======================================"
            curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3344/
